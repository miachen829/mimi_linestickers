<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片分割工具 | Image Splitter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #2d3748;
            --accent: #f56565;
            --accent-hover: #e53e3e;
            --bg: #f7fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1a202c;
            --text-muted: #718096;
            --success: #48bb78;
            --shadow: 0 10px 40px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);
        }
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.6s ease-out;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        
        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 450px 1fr;
            gap: 2rem;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        
        .grid-preview-container {
            position: relative;
            width: 100%;
            max-height: 600px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1rem;
        }
        
        .grid-preview-image {
            max-width: 100%;
            max-height: 600px;
            display: block;
            object-fit: contain;
        }
        
        .grid-overlay {
            position: absolute;
            pointer-events: none;
        }
        
        .grid-line {
            position: absolute;
            background: var(--accent);
            opacity: 0.7;
            box-shadow: 0 0 4px rgba(245, 101, 101, 0.5);
        }
        
        .grid-line.horizontal {
            width: 100%;
            height: 2px;
            left: 0;
        }
        
        .grid-line.vertical {
            height: 100%;
            width: 2px;
            top: 0;
        }
        
        .grid-preview-placeholder {
            color: var(--text-muted);
            text-align: center;
            padding: 2rem;
        }
        
        .grid-preview-placeholder-icon {
            font-size: 3rem;
            opacity: 0.3;
            margin-bottom: 1rem;
        }
        
        .resize-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .resize-card {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .resize-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        
        .resize-card.drag-over {
            border-color: var(--success);
            background: rgba(72, 187, 120, 0.1);
            transform: scale(1.02);
        }
        
        .resize-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .resize-size {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }
        
        .resize-upload-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            color: var(--text);
            font-size: 0.9rem;
        }
        
        .resize-upload-btn:hover {
            border-color: var(--accent);
            background: rgba(245, 101, 101, 0.05);
        }
        
        .resize-preview {
            margin-top: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: #f9f9f9;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .resize-preview img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        
        .resize-download-btn {
            width: 100%;
            padding: 0.6rem;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 0.75rem;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        
        .resize-download-btn:hover:not(:disabled) {
            background: #38a169;
            transform: translateY(-2px);
        }
        
        .resize-download-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .warning-text {
            font-size: 0.85rem;
            color: #d69e2e;
            margin-top: 0.5rem;
            font-style: italic;
        }
        
        .control-panel {
            background: var(--card);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: var(--shadow);
            height: fit-content;
            position: sticky;
            top: 2rem;
        }
        
        .upload-zone {
            border: 3px dashed var(--border);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--bg);
            margin-bottom: 2rem;
        }
        
        .upload-zone:hover {
            border-color: var(--accent);
            background: rgba(245, 101, 101, 0.05);
            transform: translateY(-2px);
        }
        
        .upload-zone.dragover {
            border-color: var(--accent);
            background: rgba(245, 101, 101, 0.1);
            transform: scale(1.02);
        }
        
        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        .upload-text {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        
        .upload-hint {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .section {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid var(--border);
        }
        
        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .grid-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        
        .grid-btn {
            padding: 1rem;
            border: 2px solid var(--border);
            background: var(--card);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
        }
        
        .grid-btn:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        
        .grid-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        .custom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 1rem;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        
        .input-group input {
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'JetBrains Mono', monospace;
            transition: border-color 0.2s ease;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .action-btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans TC', sans-serif;
        }
        
        .action-btn:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 101, 101, 0.3);
        }
        
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .preview-area {
            background: var(--card);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: var(--shadow);
            min-height: 600px;
        }
        
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }
        
        .preview-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
        }
        
        .download-all-btn {
            padding: 0.75rem 1.5rem;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans TC', sans-serif;
        }
        
        .download-all-btn:hover:not(:disabled) {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.3);
        }
        
        .download-all-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .tiles-grid {
            display: grid;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .tile {
            position: relative;
            border: 3px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            cursor: grab;
            transition: all 0.3s ease;
            background: var(--bg);
            aspect-ratio: 1;
        }
        
        .tile:active {
            cursor: grabbing;
        }
        
        .tile:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent);
        }
        
        .tile:hover .tile-actions {
            opacity: 1;
        }
        
        .tile.selected {
            border-color: var(--success);
            box-shadow: 0 0 0 3px rgba(72, 187, 120, 0.2);
        }
        
        .tile.dragging {
            opacity: 0.5;
        }
        
        .tile-actions {
            position: absolute;
            bottom: 8px;
            right: 8px;
            display: flex;
            gap: 0.25rem;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .tile-action-btn {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 0.4rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s ease;
        }
        
        .tile-action-btn:hover {
            background: var(--accent);
            transform: scale(1.1);
        }
        
        .tile-action-btn.delete:hover {
            background: #e53e3e;
        }
        
        .tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .tile-overlay {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .tile-checkbox {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 24px;
            height: 24px;
            accent-color: var(--success);
            cursor: pointer;
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
        
        .empty-icon {
            font-size: 4rem;
            opacity: 0.3;
            margin-bottom: 1rem;
        }
        
        .info-badge {
            display: inline-block;
            background: rgba(245, 101, 101, 0.1);
            color: var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 1rem;
            font-family: 'JetBrains Mono', monospace;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            
            .control-panel {
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>圖片分割工具</h1>
            <p class="subtitle">輕鬆將圖片分割成多個小圖，支援批次下載</p>
        </header>
        
        <div class="main-grid">
            <!-- Control Panel -->
            <div class="control-panel">
                <!-- Upload Section -->
                <div class="section">
                    <div class="upload-zone" id="uploadZone">
                        <div class="upload-icon">📤</div>
                        <div class="upload-text">點擊或拖曳圖片到此處</div>
                        <div class="upload-hint">支援 JPG、PNG、GIF 格式｜可選擇多張圖片</div>
                        <input type="file" id="fileInput" accept="image/*" multiple>
                    </div>
                </div>
                
                <!-- Grid Options -->
                <div class="section">
                    <div class="section-title">分割方式</div>
                    <div class="grid-options">
                        <button class="grid-btn active" data-grid="2">2×2</button>
                        <button class="grid-btn" data-grid="3">3×3</button>
                        <button class="grid-btn" data-grid="4">4×4</button>
                    </div>
                    <div class="custom-grid">
                        <div class="input-group">
                            <label>列數</label>
                            <input type="number" id="rows" min="1" max="20" value="2">
                        </div>
                        <div class="input-group">
                            <label>欄數</label>
                            <input type="number" id="cols" min="1" max="20" value="2">
                        </div>
                    </div>
                </div>
                
                <!-- Action Button -->
                <div class="section">
                    <button class="action-btn" id="splitBtn" disabled>開始分割圖片</button>
                    <div class="info-badge" id="imageInfo" style="display: none;"></div>
                    <div class="warning-text" id="sizeWarning" style="display: none;">
                        ⚠️ 分割後圖片將自動縮放至 370×320 px 內
                    </div>
                </div>
                
                <!-- Image Resize Section -->
                <div class="section">
                    <div class="section-title">圖片尺寸調整</div>
                    <div class="resize-section">
                        <!-- 240x240 Resizer -->
                        <div class="resize-card" id="resizeCard240">
                            <div class="resize-title">正方形調整</div>
                            <div class="resize-size">240×240</div>
                            <button class="resize-upload-btn" onclick="document.getElementById('resize240').click()">
                                📷 上傳圖片
                            </button>
                            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem;">
                                或拖曳分割圖片到此處
                            </div>
                            <input type="file" id="resize240" accept="image/*" style="display: none;">
                            <div class="resize-preview" id="preview240">
                                <span style="color: #999; font-size: 0.85rem;">預覽區</span>
                            </div>
                            <button class="resize-download-btn" id="download240" disabled>下載 240×240</button>
                        </div>
                        
                        <!-- 96x74 Resizer -->
                        <div class="resize-card" id="resizeCard96">
                            <div class="resize-title">小型圖片調整</div>
                            <div class="resize-size">96×74</div>
                            <button class="resize-upload-btn" onclick="document.getElementById('resize96').click()">
                                📷 上傳圖片
                            </button>
                            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem;">
                                或拖曳分割圖片到此處
                            </div>
                            <input type="file" id="resize96" accept="image/*" style="display: none;">
                            <div class="resize-preview" id="preview96">
                                <span style="color: #999; font-size: 0.85rem;">預覽區</span>
                            </div>
                            <button class="resize-download-btn" id="download96" disabled>下載 96×74</button>
                        </div>
                    </div>
                </div>
                
                <!-- Grid Preview Section -->
                <div class="section">
                    <div class="section-title">分割線預覽</div>
                    <div class="grid-preview-container" id="gridPreviewContainer">
                        <div class="grid-preview-placeholder">
                            <div class="grid-preview-placeholder-icon">📐</div>
                            <p>上傳圖片後<br>此處顯示分割預覽</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Preview Area -->
            <div class="preview-area">
                <div class="preview-header">
                    <div class="preview-title">預覽分割結果</div>
                    <button class="download-all-btn" id="downloadAllBtn" disabled>
                        📦 下載全部 (ZIP)
                    </button>
                </div>
                
                <div id="tilesContainer">
                    <div class="empty-state">
                        <div class="empty-icon">🖼️</div>
                        <p>上傳圖片後，分割結果將顯示在這裡</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const splitBtn = document.getElementById('splitBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const tilesContainer = document.getElementById('tilesContainer');
        const imageInfo = document.getElementById('imageInfo');
        const sizeWarning = document.getElementById('sizeWarning');
        const rowsInput = document.getElementById('rows');
        const colsInput = document.getElementById('cols');
        const gridBtns = document.querySelectorAll('.grid-btn');
        const gridPreviewContainer = document.getElementById('gridPreviewContainer');
        
        let uploadedImages = [];
        let currentPreviewIndex = 0;
        let tiles = [];
        let tileCounter = 1;
        
        // Resize functionality
        const resizers = {
            240: { 
                input: document.getElementById('resize240'), 
                preview: document.getElementById('preview240'), 
                download: document.getElementById('download240'), 
                card: document.getElementById('resizeCard240'),
                canvas: null 
            },
            96: { 
                input: document.getElementById('resize96'), 
                preview: document.getElementById('preview96'), 
                download: document.getElementById('download96'), 
                card: document.getElementById('resizeCard96'),
                canvas: null 
            }
        };
        
        // Handle multiple files upload
        function handleFiles(files) {
            uploadedImages = [];
            currentPreviewIndex = 0;
            
            const fileArray = Array.from(files).filter(f => f.type.startsWith('image/'));
            
            if (fileArray.length === 0) {
                alert('請上傳圖片檔案！');
                return;
            }
            
            let loadedCount = 0;
            
            fileArray.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        uploadedImages.push({
                            img: img,
                            name: file.name.split('.')[0]
                        });
                        loadedCount++;
                        
                        if (loadedCount === fileArray.length) {
                            // All images loaded
                            splitBtn.disabled = false;
                            imageInfo.style.display = 'block';
                            imageInfo.textContent = `已上傳 ${uploadedImages.length} 張圖片`;
                            updateGridPreview();
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
        
        function handleResizeFromFile(file, targetSize, elements) {
            if (!file.type.startsWith('image/')) {
                alert('請上傳圖片檔案！');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    resizeImage(img, targetSize, elements);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        function handleResizeFromCanvas(sourceCanvas, targetSize, elements) {
            const img = new Image();
            img.onload = () => {
                resizeImage(img, targetSize, elements);
            };
            img.src = sourceCanvas.toDataURL('image/png');
        }
        
        function resizeImage(img, targetSize, elements) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            if (targetSize === 240) {
                canvas.width = 240;
                canvas.height = 240;
            } else {
                canvas.width = 96;
                canvas.height = 74;
            }
            
            // Draw image to fit canvas (cover mode)
            const scale = Math.max(canvas.width / img.width, canvas.height / img.height);
            const x = (canvas.width - img.width * scale) / 2;
            const y = (canvas.height - img.height * scale) / 2;
            
            ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
            
            elements.canvas = canvas;
            elements.preview.innerHTML = `<img src="${canvas.toDataURL('image/png')}" alt="Preview">`;
            elements.download.disabled = false;
        }
        
        // Update grid preview
        function updateGridPreview() {
            if (uploadedImages.length === 0) return;
            
            const rows = parseInt(rowsInput.value);
            const cols = parseInt(colsInput.value);
            
            gridPreviewContainer.innerHTML = '';
            
            const currentImage = uploadedImages[currentPreviewIndex];
            
            // Add image
            const img = document.createElement('img');
            img.src = currentImage.img.src;
            img.className = 'grid-preview-image';
            gridPreviewContainer.appendChild(img);
            
            // Wait for image to render to get actual dimensions
            img.onload = () => {
                const imgRect = img.getBoundingClientRect();
                const containerRect = gridPreviewContainer.getBoundingClientRect();
                
                // Calculate image position relative to container
                const imgLeft = (containerRect.width - imgRect.width) / 2;
                const imgTop = (containerRect.height - imgRect.height) / 2;
                
                // Add grid overlay
                const overlay = document.createElement('div');
                overlay.className = 'grid-overlay';
                overlay.style.left = imgLeft + 'px';
                overlay.style.top = imgTop + 'px';
                overlay.style.width = imgRect.width + 'px';
                overlay.style.height = imgRect.height + 'px';
                
                // Add horizontal lines
                for (let i = 1; i < rows; i++) {
                    const line = document.createElement('div');
                    line.className = 'grid-line horizontal';
                    line.style.top = `${(i / rows) * 100}%`;
                    overlay.appendChild(line);
                }
                
                // Add vertical lines
                for (let i = 1; i < cols; i++) {
                    const line = document.createElement('div');
                    line.className = 'grid-line vertical';
                    line.style.left = `${(i / cols) * 100}%`;
                    overlay.appendChild(line);
                }
                
                gridPreviewContainer.appendChild(overlay);
            };
            
            // Trigger onload if image is already cached
            if (img.complete) {
                img.onload();
            }
        }
        
        function splitImage(img, rows, cols) {
            let tileWidth = img.width / cols;
            let tileHeight = img.height / rows;
            
            // Check if tiles exceed max size and scale down if needed
            const maxWidth = 370;
            const maxHeight = 320;
            let scale = 1;
            
            if (tileWidth > maxWidth || tileHeight > maxHeight) {
                scale = Math.min(maxWidth / tileWidth, maxHeight / tileHeight);
                tileWidth = Math.floor(tileWidth * scale);
                tileHeight = Math.floor(tileHeight * scale);
                sizeWarning.style.display = 'block';
            } else {
                sizeWarning.style.display = 'none';
            }
            
            // Set grid layout
            tilesContainer.style.display = 'grid';
            tilesContainer.style.gridTemplateColumns = `repeat(auto-fill, minmax(150px, 1fr))`;
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const canvas = document.createElement('canvas');
                    canvas.width = tileWidth;
                    canvas.height = tileHeight;
                    const ctx = canvas.getContext('2d');
                    
                    // Calculate source dimensions
                    const srcWidth = img.width / cols;
                    const srcHeight = img.height / rows;
                    
                    ctx.drawImage(
                        img,
                        col * srcWidth,
                        row * srcHeight,
                        srcWidth,
                        srcHeight,
                        0,
                        0,
                        tileWidth,
                        tileHeight
                    );
                    
                    const tileIndex = tiles.length;
                    const tileDiv = document.createElement('div');
                    tileDiv.className = 'tile selected';
                    tileDiv.draggable = true;
                    
                    // Drag start
                    tileDiv.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', tileIndex);
                        tileDiv.classList.add('dragging');
                    });
                    
                    tileDiv.addEventListener('dragend', () => {
                        tileDiv.classList.remove('dragging');
                    });
                    
                    const tileImg = document.createElement('img');
                    tileImg.src = canvas.toDataURL('image/png');
                    
                    const overlay = document.createElement('div');
                    overlay.className = 'tile-overlay';
                    overlay.textContent = String(tileCounter).padStart(2, '0');
                    
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'tile-checkbox';
                    checkbox.checked = true;
                    checkbox.addEventListener('change', (e) => {
                        if (e.target.checked) {
                            tileDiv.classList.add('selected');
                        } else {
                            tileDiv.classList.remove('selected');
                        }
                    });
                    
                    // Action buttons
                    const actions = document.createElement('div');
                    actions.className = 'tile-actions';
                    
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'tile-action-btn';
                    downloadBtn.textContent = '💾';
                    downloadBtn.title = '下載';
                    const currentCounter = tileCounter;
                    downloadBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const link = document.createElement('a');
                        link.download = `${String(currentCounter).padStart(2, '0')}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'tile-action-btn delete';
                    deleteBtn.textContent = '🗑️';
                    deleteBtn.title = '刪除';
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        tileDiv.remove();
                        tiles[tileIndex] = null; // Mark as deleted
                    });
                    
                    actions.appendChild(downloadBtn);
                    actions.appendChild(deleteBtn);
                    
                    tileDiv.appendChild(checkbox);
                    tileDiv.appendChild(tileImg);
                    tileDiv.appendChild(overlay);
                    tileDiv.appendChild(actions);
                    tilesContainer.appendChild(tileDiv);
                    
                    tiles.push({
                        canvas,
                        name: `${String(tileCounter).padStart(2, '0')}.png`,
                        checkbox,
                        element: tileDiv
                    });
                    
                    tileCounter++;
                }
            }
        }
        
        // Setup drag and drop for resize cards
        Object.entries(resizers).forEach(([size, elements]) => {
            // File input handler
            elements.input.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleResizeFromFile(e.target.files[0], parseInt(size), elements);
                }
            });
            
            // Download handler
            elements.download.addEventListener('click', () => {
                if (elements.canvas) {
                    const link = document.createElement('a');
                    const filename = size === '240' ? 'main.png' : 'tab.png';
                    link.download = filename;
                    link.href = elements.canvas.toDataURL('image/png');
                    link.click();
                }
            });
            
            // Drag and drop handlers
            elements.card.addEventListener('dragover', (e) => {
                e.preventDefault();
                elements.card.classList.add('drag-over');
            });
            
            elements.card.addEventListener('dragleave', () => {
                elements.card.classList.remove('drag-over');
            });
            
            elements.card.addEventListener('drop', (e) => {
                e.preventDefault();
                elements.card.classList.remove('drag-over');
                
                // Check if it's a tile being dragged
                const tileData = e.dataTransfer.getData('text/plain');
                if (tileData) {
                    const tileIndex = parseInt(tileData);
                    if (!isNaN(tileIndex) && tiles[tileIndex]) {
                        handleResizeFromCanvas(tiles[tileIndex].canvas, parseInt(size), elements);
                    }
                }
            });
        });
        
        // Upload zone interactions
        uploadZone.addEventListener('click', () => fileInput.click());
        
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFiles(files);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFiles(e.target.files);
            }
        });
        
        // Grid preset buttons
        gridBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                gridBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const grid = btn.dataset.grid;
                rowsInput.value = grid;
                colsInput.value = grid;
                updateGridPreview();
            });
        });
        
        // Custom grid inputs
        rowsInput.addEventListener('input', () => {
            gridBtns.forEach(b => b.classList.remove('active'));
            updateGridPreview();
        });
        
        colsInput.addEventListener('input', () => {
            gridBtns.forEach(b => b.classList.remove('active'));
            updateGridPreview();
        });
        
        // Split image
        splitBtn.addEventListener('click', () => {
            if (uploadedImages.length === 0) return;
            
            const rows = parseInt(rowsInput.value);
            const cols = parseInt(colsInput.value);
            
            if (rows < 1 || cols < 1 || rows > 20 || cols > 20) {
                alert('請輸入 1-20 之間的數字！');
                return;
            }
            
            // Clear existing tiles
            tiles = [];
            tileCounter = 1;
            tilesContainer.innerHTML = '';
            
            // Split all uploaded images
            uploadedImages.forEach(imageData => {
                splitImage(imageData.img, rows, cols);
            });
            
            downloadAllBtn.disabled = false;
        });
        
        // Download all selected tiles as ZIP
        downloadAllBtn.addEventListener('click', async () => {
            const zip = new JSZip();
            const selectedTiles = tiles.filter(tile => tile && tile.checkbox.checked);
            
            if (selectedTiles.length === 0 && !resizers[240].canvas && !resizers[96].canvas) {
                alert('請至少選擇一張圖片！');
                return;
            }
            
            // Add split tiles
            selectedTiles.forEach(tile => {
                const dataUrl = tile.canvas.toDataURL('image/png');
                const base64Data = dataUrl.split(',')[1];
                zip.file(tile.name, base64Data, { base64: true });
            });
            
            // Add 240x240 image if exists
            if (resizers[240].canvas) {
                const dataUrl = resizers[240].canvas.toDataURL('image/png');
                const base64Data = dataUrl.split(',')[1];
                zip.file('main.png', base64Data, { base64: true });
            }
            
            // Add 96x74 image if exists
            if (resizers[96].canvas) {
                const dataUrl = resizers[96].canvas.toDataURL('image/png');
                const base64Data = dataUrl.split(',')[1];
                zip.file('tab.png', base64Data, { base64: true });
            }
            
            const blob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `images_${selectedTiles.length}tiles.zip`;
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
